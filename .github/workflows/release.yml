# Build installers and publish them to a GitHub Release.
#
# Triggered by pushing a version tag, so cutting a release is one command:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The point is that a player never sees any of this. They open the Releases
# page and download one file — no Node, no Rust, no toolchain, no terminal.
name: Release

on:
  push:
    tags:
      - 'v*'
  # Also runnable by hand, so the build can be proven before a tag is cut
  # rather than discovering it is broken at the moment you want to ship.
  workflow_dispatch:

jobs:
  build:
    # Windows only for now: the overlay uses Win32 window tracking, and the
    # README does not claim Linux support it does not have.
    runs-on: windows-latest

    permissions:
      contents: write
      # Build provenance. Not a substitute for code signing -- see
      # docs/RELEASING.md -- but it does let someone check that a binary came
      # from this repository and this workflow rather than from a lookalike.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # Keyed on the lockfile so a dependency change invalidates it, and scoped
      # to the Tauri crate directory where the build actually happens.
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install dependencies
        run: npm ci

      # The suite is fast and catches the things a release must not ship with.
      # Suites needing PostgreSQL skip on their own without EDFM_TEST_DSN.
      - name: Test
        run: npm test --workspaces --if-present

      - name: Typecheck
        run: npm run typecheck --workspaces --if-present

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: 'EDFM Companion ${{ github.ref_name }}'
          releaseBody: |
            Download the `.msi` or `.exe` below and run it.

            Windows will likely warn that the publisher is unrecognised, because
            the installer is not code-signed. Choose **More info → Run anyway**.

            `SHA256SUMS.txt` lets you check a download matches what this workflow
            built, and each binary carries a signed build attestation you can
            verify with `gh attestation verify <file> --repo ${{ github.repository }}`.
            Neither is a code-signing certificate: they prove where a file came
            from, not that Windows will trust it.

            Everything works offline. Contributing observations to EDFM is
            optional and off until you turn it on in Settings.
          releaseDraft: true
          prerelease: false

      # SHA-256 for every published artifact.
      #
      # This lets a download be checked against what the workflow produced. It
      # says nothing about who built it -- that is what the attestation below is
      # for, and neither replaces Authenticode. See docs/RELEASING.md.
      - name: Checksums
        shell: pwsh
        run: |
          $paths = '${{ steps.tauri.outputs.artifactPaths }}' | ConvertFrom-Json
          $lines = foreach ($p in $paths) {
            $h = (Get-FileHash -Algorithm SHA256 -Path $p).Hash.ToLower()
            "$h  $([System.IO.Path]::GetFileName($p))"
          }
          $lines | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ join(fromJSON(steps.tauri.outputs.artifactPaths), ',') }}

      - name: Publish the checksums alongside the installers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: gh release upload ${{ github.ref_name }} SHA256SUMS.txt --clobber
