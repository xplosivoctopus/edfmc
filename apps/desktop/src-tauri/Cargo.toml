[package]
name = "edfm-companion"
version = "0.1.0"
description = "Official desktop companion for the Elite Dangerous Field Manual"
authors = ["EDFM"]
edition = "2021"

[lib]
name = "edfm_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-http = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

# Known-folder resolution. Windows-only: §3 requires FOLDERID_SavedGames rather
# than string-building a path from the user profile.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  # Overlay: game-window discovery, geometry, monitor bounds and DPI. All
  # read-only, public APIs — see the constraint note at the top of overlay.rs.
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
] }
