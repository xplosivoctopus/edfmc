[package]
name = "edfm-companion"
version = "0.1.0"
description = "Official desktop companion for the Elite Dangerous Field Manual"
authors = ["EDFM"]
edition = "2021"

[lib]
name = "edfm_companion_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Trimmed deliberately. The defaults bundle rustls plus a root store, HTTP/2,
# charset transcoding and a cookie jar; this client talks JSON to one stateless
# API over TLS. native-tls uses schannel, the TLS stack Windows already has, and
# system-proxy is kept so a commander behind a corporate proxy still works.
# OS-backed credential storage: Windows Credential Manager via the native
# backend. See src/credentials.rs for why this rather than Stronghold or the
# settings table.
keyring = { version = "4", default-features = false, features = [
    "v1",
    "windows-native-keyring-store",
] }

tauri-plugin-http = { version = "2", default-features = false, features = [
    "native-tls",
    "system-proxy",
] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
# A user-chosen global hotkey for screenshot capture. Nothing is bound by
# default -- see src/screenshot.rs and docs/SCREENSHOTS.md.
tauri-plugin-global-shortcut = "2"
# PNG encoding only. The `image` crate would bring a dozen decoders for formats
# this never reads; captures are always written as PNG.
png = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
notify = "6"

# Known-folder resolution. Windows-only: §3 requires FOLDERID_SavedGames rather
# than string-building a path from the user profile.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_UI_Shell",
  # Overlay: game-window discovery, geometry, monitor bounds and DPI. All
  # read-only, public APIs — see the constraint note at the top of overlay.rs.
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_HiDpi",
  "Win32_Graphics_Gdi",
] }
